<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/welcome.css') }}">
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1 class="logo-text">MOTENTITY</h1>
        </div>
        <nav class="nav">
            <a href="/leagues">Home</a>
            <a href="/trade">Trade</a>
            <a href="/all-teams">Teams</a>
            <a href="/waivers">Waivers</a>
            <a href="/matches">Matches</a>
            <a href="/newleague">New League</a>
            <a href="/profile">Profile</a>
            <a href="/logout" class="logout-btn">Log Out</a>
        </nav>
    </header>
    <h1 class="text-center">Teams in the <em>{{ leagueName }}</em> League</h1>
        {% for team in teams %}
            <div class="team-container">
                <div>
                    <label>Team Name: {{ team.TeamName }}</label>
                </div>
                <div>
                    <label>League: {{ team.League_ID }}</label>
                </div>
                <div>
                    <label>Status: {{ 'Active' if team.TeamStatus == 'A' else 'Inactive' }}</label>
                </div>
                <div>
                    <label>Total Points: {{ team.TotalPoints }}</label>
                </div>
                <div>
                    <label>Ranking: {{ team.Ranking }}</label>
                </div>
                {% if team.TeamOwner|int == userid|int %}
                    <div>
                        <a href="/change-my-team/{{ team.Team_ID }}" class="btn btn-primary">Modify Your Team</a>
                    </div>
                {% endif %}
            </div>
        {% endfor %}
    </div>
    <div class="cta fixed-bottom">
        <a href="/leagues" class="btn btn-primary">Back to Home</a>
    </div>
</body>
</html>
