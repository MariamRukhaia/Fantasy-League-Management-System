<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/welcome.css') }}">
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1 class="logo-text">MOTENTITY</h1>
        </div>
        <nav class="nav">
            <a href="/leagues">Home</a>
            <a href="/trade">Trade</a>
            <a href="/all-teams">Teams</a>
            <a href="/waivers">Waivers</a>
            <a href="/matches">Matches</a>
            <a href="/newleague">New League</a>
            <a href="/profile">Profile</a>
            <a href="/logout" class="logout-btn">Log Out</a>
        </nav>
    </header>

    <div class="profile-container">
        <h1>Profile Settings</h1>
        <form action="{{ url_for('profile') }}" method="POST">
            <div class="profile-field">
                <label for="fullname">Name:</label>
                <input type="text" id="fullname" name="fullname" value="{{ user['FullName'] }}" required>
            </div>
            <div class="profile-field">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{ user['Email'] }}" required>
            </div>
            <div class="profile-field">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" value="{{ user['Username'] }}" required>
            </div>
            <div class="profile-field">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter new password">
            </div>
            <div class="profile-field">
                <label for="settings">Profile Settings:</label>
                <textarea id="settings" name="settings" placeholder="Enter additional profile settings"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </div>
</body>
</html>
